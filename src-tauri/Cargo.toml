[package]
name = "app"
version = "0.1.0"
description = "PlayArc — local game playtime tracker"
authors = ["K1nesss"]
license-file = "../LICENSE"
repository = "https://github.com/K1nesss/PlayArc"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
steamlocate = "2.0.1"
sysinfo = "0.36.1"
rusqlite = { version = "0.31.0", features = ["bundled"] }
notify = "8.2.0"
glob = "0.3.1"
base64 = "0.22.1"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

# Smaller, faster release builds (dev builds are unaffected).
# panic stays "unwind": the background watcher threads must not take the app down.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
